name: Live check

# The unit tests stub the network. This runs the CLI against the real sources
# once a week, so a feed that moved or changed shape shows up as a failed run
# instead of as a silently empty section.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/live-check.mjs
